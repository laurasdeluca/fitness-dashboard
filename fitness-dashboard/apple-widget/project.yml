name: LaurFitnessTracker
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  bundleIdPrefix: com.laurdeluca
settings:
  SWIFT_VERSION: "5.9"
targets:
  LaurFitnessTracker:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.laurdeluca.LaurFitnessTracker
      INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: LaurFitnessWidget
  LaurFitnessWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.laurdeluca.LaurFitnessTracker.Widget
      INFOPLIST_FILE: Widget/Info.plist
  LaurFitnessTrackerMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.laurdeluca.LaurFitnessTracker.mac
      INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: LaurFitnessWidgetMac
  LaurFitnessWidgetMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.laurdeluca.LaurFitnessTracker.Widget.mac
      INFOPLIST_FILE: Widget/Info.plist
